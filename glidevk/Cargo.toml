[package]
name = "glidevk"
version = "0.1.0"
edition = "2021"

[dependencies]
ash = {version = "0.38", default-features = false, features = ["loaded", "debug", "std"] }
ash-window = "0.13.0"
env_logger = "0.10.0"
lazy_static = "1.4.0"
libc = "0.2.147"
log = "0.4.19"
num = "0.4.0"
memoffset = "0.5.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
winit = { version = "0.29", features = ["rwh_06"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.5", features = ["windef", "libloaderapi", "winuser"] }

[build-dependencies]
cross = "0.2.5"
