[package]
name = "glidevk"
version = "0.1.0"
edition = "2021"

[dependencies]
ash = {version = "0.38", default-features = false, features = ["loaded", "debug", "std"] }
ash-window = "0.13.0"
log = "0.4.19"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
winit = { version = "0.29", features = ["rwh_06"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.5", features = ["commctrl", "errhandlingapi", "libloaderapi", "memoryapi", "windef", "winuser"] }
