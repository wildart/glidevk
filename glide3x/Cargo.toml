[package]
name = "glide3x"
version = "0.1.0"
edition = "2021"

[dependencies]
lazy_static = "1.4.0"
log = "0.4"
glidevk = {path = "../glidevk"}
winit = { version = "0.29", features = ["rwh_06"] }
env_logger = "0.11"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

